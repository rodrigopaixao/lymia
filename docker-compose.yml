services:
  db-init:
    image: alpine:3.20
    volumes:
      - ./nodered-data:/data
      - ./db:/db:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        if [ ! -f /data/escola.db ]; then
          sqlite3 /data/escola.db < /db/init.sql
          echo "SQLite: escola.db criado em nodered-data/"
        else
          echo "SQLite: escola.db ja existe"
        fi

  nodered:
    build:
      context: .
      dockerfile: Dockerfile
    image: lyvia-nodered:latest
    container_name: lyvia-nodered
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "1880:1880"
    environment:
      TZ: America/Toronto
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WATSON_API_KEY: ${WATSON_API_KEY:-}
      WATSON_ASSISTANT_ID: ${WATSON_ASSISTANT_ID:-}
      WATSON_SERVICE_URL: ${WATSON_SERVICE_URL:-}
      WATSON_VERSION: ${WATSON_VERSION:-2024-08-25}
    volumes:
      - ./nodered-data:/data
